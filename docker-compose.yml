x-backend-env-overrides: &backend-env-overrides
  DATABASE_URL: postgresql://stitch_wish:stitch_wish_dev@postgres:5432/stitch_wish
  REDIS_URL: redis://redis:6379
  CONVERSION_ENGINE_URL: http://conversion-engine:8000

x-backend: &backend
  build:
    context: ./backend
    dockerfile: Dockerfile.dev
  env_file:
    - ./backend/.env
  working_dir: /app
  volumes:
    - ./backend:/app
    - backend-node-modules:/app/node_modules

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stitch_wish
      POSTGRES_USER: stitch_wish
      POSTGRES_PASSWORD: stitch_wish_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stitch_wish -d stitch_wish"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  conversion-engine:
    build:
      context: ./conversion-engine
      dockerfile: Dockerfile.dev
    environment:
      LOG_LEVEL: "${CONVERSION_LOG_LEVEL:-info}"
      MAX_CONCURRENT_CONVERSIONS: "${MAX_CONCURRENT_CONVERSIONS:-1}"
    volumes:
      - ./conversion-engine:/app
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('PORT', '8000') + '/v1/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  migrate:
    <<: *backend
    environment: *backend-env-overrides
    command: ["npm", "run", "migration:run"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    environment: *backend-env-overrides
    command: ["npm", "run", "start:dev"]
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *backend
    environment: *backend-env-overrides
    command: ["npm", "run", "start:worker:dev"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      conversion-engine:
        condition: service_healthy

  admin-console:
    build:
      context: ./admin-console
      dockerfile: Dockerfile.dev
    env_file:
      - ./admin-console/.env
    environment:
      ADMIN_API_URL: http://api:3000
    working_dir: /app
    volumes:
      - ./admin-console:/app
      - admin-console-node-modules:/app/node_modules
    ports:
      - "3001:3000"
    depends_on:
      - api

  website:
    build:
      context: ./website
      dockerfile: Dockerfile.dev
    env_file:
      - ./website/.env
    environment:
      VITE_API_URL: http://localhost:3000
      VITE_ADMIN_CONSOLE_URL: http://localhost:3001
    working_dir: /app
    volumes:
      - ./website:/app
      - website-node-modules:/app/node_modules
    ports:
      - "5173:5173"
    # website is a public marketing site; no dependency on api is required
    # for the dev server itself (account deletion POSTs directly from the browser)

volumes:
  postgres-data:
  redis-data:
  backend-node-modules:
  admin-console-node-modules:
  website-node-modules:
