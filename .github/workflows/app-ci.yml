name: App CI

on:
  push:
    branches:
      - main
      - staging
    paths:
      - 'app/**'
      - 'backend/**'
      - '.github/workflows/app-ci.yml'
  pull_request:
    branches:
      - main
      - staging
    paths:
      - 'app/**'
      - 'backend/**'
      - '.github/workflows/app-ci.yml'

jobs:
  app-checks:
    name: App Type Check and Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            app/package-lock.json
            backend/package-lock.json

      - name: Install app dependencies
        run: npm ci
        working-directory: app

      # app/tsconfig.json pulls in scripts/generate-bundled-patterns.ts, which
      # imports from ../backend/src/conversion/pattern-thumbnail-renderer.
      # Backend deps must be present or the type check fails on missing
      # modules (e.g. `pngjs`) that belong to the backend package, not the app.
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Run TypeScript check
        run: npm run ts:check
        working-directory: app

      - name: Run Jest tests
        run: npm test
        working-directory: app
