name: Backend Integration

on:
  push:
    branches:
      - main
      - staging
    paths:
      - 'backend/**'
      - '.github/workflows/backend-integration.yml'
  pull_request:
    branches:
      - main
      - staging
    paths:
      - 'backend/**'
      - '.github/workflows/backend-integration.yml'

defaults:
  run:
    working-directory: backend

jobs:
  integration:
    name: Backend Integration Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      # `npm run lint` is deliberately absent: the tree carries 379 pre-existing
      # ESLint errors, so gating on it here would keep this workflow permanently
      # red for reasons unrelated to the integration suite.
      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Run integration tests
        run: npm run test:integration
