x-logging: &default-logging
  driver: json-file
  options:
    max-file: "5"
    max-size: 10m

x-backend-environment: &backend-environment
  AD_ATTEMPT_TTL_SECONDS: "${AD_ATTEMPT_TTL_SECONDS:-300}"
  AI_CREDIT_RESERVATION_STALENESS_SECONDS: "${AI_CREDIT_RESERVATION_STALENESS_SECONDS:-1800}"
  CONVERSION_ENGINE_URL: http://conversion-engine:8000
  CONVERSION_WORKER_CONCURRENCY: "${CONVERSION_WORKER_CONCURRENCY:-1}"
  DATABASE_URL: "${DATABASE_URL:?}"
  EMAIL_FROM_ADDRESS: "${EMAIL_FROM_ADDRESS:?}"
  EMAIL_OTP_MAX_ATTEMPTS: "${EMAIL_OTP_MAX_ATTEMPTS:-5}"
  EMAIL_OTP_RATE_LIMIT_PER_EMAIL: "${EMAIL_OTP_RATE_LIMIT_PER_EMAIL:-5}"
  EMAIL_OTP_RATE_LIMIT_PER_IP: "${EMAIL_OTP_RATE_LIMIT_PER_IP:-20}"
  EMAIL_OTP_TTL_SECONDS: "${EMAIL_OTP_TTL_SECONDS:-600}"
  FAL_KEY: "${FAL_KEY:?}"
  FAL_WEBHOOK_BASE_URL: "${FAL_WEBHOOK_BASE_URL:?}"
  FAL_WEBHOOK_SECRET: "${FAL_WEBHOOK_SECRET:?}"
  GAMEPLAY_EVENT_PARTITION_MAINTENANCE_INTERVAL_SECONDS: "${GAMEPLAY_EVENT_PARTITION_MAINTENANCE_INTERVAL_SECONDS:-86400}"
  GAMEPLAY_EVENT_RETENTION_MONTHS: "${GAMEPLAY_EVENT_RETENTION_MONTHS:-13}"
  GRANT_SIGNING_SECRET: "${GRANT_SIGNING_SECRET:?}"
  GRANT_TTL_SECONDS: "${GRANT_TTL_SECONDS:-300}"
  JWT_ACCESS_TTL_SECONDS: "${JWT_ACCESS_TTL_SECONDS:-900}"
  JWT_SECRET: "${JWT_SECRET:?}"
  NODE_ENV: production
  OPENAI_API_KEY: "${OPENAI_API_KEY:?}"
  OPENAI_MODERATION_ENABLED: "${OPENAI_MODERATION_ENABLED:-true}"
  OPERATIONAL_ALERTS_COOLDOWN_SECONDS: "${OPERATIONAL_ALERTS_COOLDOWN_SECONDS:-1800}"
  OPERATIONAL_ALERTS_EVALUATION_INTERVAL_SECONDS: "${OPERATIONAL_ALERTS_EVALUATION_INTERVAL_SECONDS:-300}"
  OPERATIONAL_ALERTS_PROMOTION_NEEDS_ATTENTION_THRESHOLD: "${OPERATIONAL_ALERTS_PROMOTION_NEEDS_ATTENTION_THRESHOLD:-1}"
  OPERATIONAL_ALERTS_QUEUE_DEPTH_THRESHOLD: "${OPERATIONAL_ALERTS_QUEUE_DEPTH_THRESHOLD:-200}"
  OPERATIONAL_ALERTS_STUCK_JOB_STALENESS_SECONDS: "${OPERATIONAL_ALERTS_STUCK_JOB_STALENESS_SECONDS:-1800}"
  OPERATIONAL_ALERTS_STUCK_JOB_THRESHOLD: "${OPERATIONAL_ALERTS_STUCK_JOB_THRESHOLD:-1}"
  OPERATIONAL_ALERTS_WEBHOOK_FAILURE_THRESHOLD: "${OPERATIONAL_ALERTS_WEBHOOK_FAILURE_THRESHOLD:-10}"
  OPERATIONAL_ALERTS_WEBHOOK_FAILURE_WINDOW_SECONDS: "${OPERATIONAL_ALERTS_WEBHOOK_FAILURE_WINDOW_SECONDS:-3600}"
  OTP_SIGNING_SECRET: "${OTP_SIGNING_SECRET:?}"
  PORT: "3000"
  RECONCILIATION_INTERVAL_SECONDS: "${RECONCILIATION_INTERVAL_SECONDS:-900}"
  REDIS_URL: "${REDIS_URL:?}"
  REFRESH_TOKEN_TTL_SECONDS: "${REFRESH_TOKEN_TTL_SECONDS:-2592000}"
  REVENUECAT_WEBHOOK_AUTH_TOKEN: "${REVENUECAT_WEBHOOK_AUTH_TOKEN:?}"
  RESEND_API_KEY: "${RESEND_API_KEY:?}"
  SENTRY_DSN: "${SENTRY_DSN:?}"
  SENTRY_ENVIRONMENT: "${SENTRY_ENVIRONMENT:?}"
  SENTRY_RELEASE: "${SENTRY_RELEASE:?}"
  SENTRY_TRACES_SAMPLE_RATE: "${SENTRY_TRACES_SAMPLE_RATE:-0.2}"
  STORAGE_LOCAL_DIR: /var/lib/stitch-wish/storage
  WEBHOOK_ARCHIVE_PURGE_INTERVAL_SECONDS: "${WEBHOOK_ARCHIVE_PURGE_INTERVAL_SECONDS:-3600}"
  WEBHOOK_ARCHIVE_RETENTION_SECONDS: "${WEBHOOK_ARCHIVE_RETENTION_SECONDS:-2592000}"

x-backend: &backend
  build:
    context: ./backend
    dockerfile: Dockerfile
    target: runtime
  environment: *backend-environment
  init: true
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  logging: *default-logging

services:
  migrate:
    <<: *backend
    command:
      - node
      - node_modules/typeorm/cli.js
      - migration:run
      - -d
      - dist/database/data-source.js
    exclude_from_hc: true
    restart: "no"

  conversion-engine:
    build:
      context: ./conversion-engine
      dockerfile: Dockerfile
    environment:
      HOST: 0.0.0.0
      LOG_LEVEL: "${CONVERSION_LOG_LEVEL:-info}"
      MAX_CONCURRENT_CONVERSIONS: ${MAX_CONCURRENT_CONVERSIONS:-1}
      PORT: "8000"
    expose:
      - "8000"
    init: true
    networks:
      - conversion
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    logging: *default-logging

  api:
    <<: *backend
    command: ["node", "dist/main.api.js"]
    environment:
      <<: *backend-environment
      FIREBASE_PROJECT_ID: "${FIREBASE_PROJECT_ID:?}"
      FIREBASE_SERVICE_ACCOUNT_BASE64: "${FIREBASE_SERVICE_ACCOUNT_BASE64:?}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    volumes:
      - backend-storage:/var/lib/stitch-wish/storage
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/v1/health')
          .then((response) => { if (!response.ok) process.exit(1); })
          .catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    <<: *backend
    command: ["node", "dist/main.worker.js"]
    depends_on:
      conversion-engine:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - backend-storage:/var/lib/stitch-wish/storage
    networks:
      - default
      - conversion
    restart: unless-stopped
    stop_grace_period: 60s

networks:
  conversion:
    internal: true

volumes:
  backend-storage:
